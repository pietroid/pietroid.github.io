name: pietroid_github_io
description: Personal blog built with Jaspr
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  jaspr: ^0.23.1
  jaspr_content: ^0.5.2
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.8.2
  flutter_svg: ^2.3.0
  flame: ^1.21.0
  path: ^1.9.0
  yaml: ^3.1.4

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.6.0
  jaspr_builder: ^0.23.1
  lints: ^5.0.0

jaspr:
  mode: static
  flutter: embedded

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    # Rubik (SIL Open Font License), the font finchcare.com uses. Used by the
    # weekly goals demo under /internal.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-400.ttf
          weight: 400
        - asset: assets/fonts/Rubik-500.ttf
          weight: 500
        - asset: assets/fonts/Rubik-700.ttf
          weight: 700
